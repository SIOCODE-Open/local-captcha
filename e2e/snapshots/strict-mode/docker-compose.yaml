services:
  local-captcha:
    build:
      context: ../../../
      dockerfile: Dockerfile
    volumes:
      - ./local-captcha.config.yaml:/config.yaml:ro
    ports:
      - "${STRICT_TEST_PORT:-8081}:8080"
    environment:
      - PORT=8080
      - BASE_URL=${STRICT_BASE_URL:-http://localhost:8081}
